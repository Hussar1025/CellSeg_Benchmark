# Baysor C++ config: CosMx human brain, 29 selected FOVs (~10,400 reference cells)
#
# Input generated by yourpath/baysor/prepare_cosmx_human_brain_baysor.py:
#   yourpath/dataset/cosmx_human_brain/_inspect_cache/tx_fov_4_18_51_52_56_65_74_87_90_101_104_110_124_131_147_173_187_220_224_234_242_250_255_256_264_296_298_307_339.parquet
# C++ Baysor does not accept .csv.gz directly; this Parquet already contains only the FOVs listed below.

[data]
x = "x_global_px"
y = "y_global_px"
z = "z"
gene = "target"
force_2d = true                 # z is a discrete focal-plane index, not on the same unit scale as x/y
min_molecules_per_gene = 1
exclude_genes = "SystemControl*,Negative*,NegPrb*,Neg_*,FalseCode*,Blank*,UnassignedCodeword*,DeprecatedCodeword*,GenomicControl*"
min_molecules_per_cell = 50
confidence_nn_id = 26

# No x/y_min/max: the input Parquet is already strictly filtered to the FOVs, which are not contiguous in global coordinates.

[segmentation]
# scale is the cell radius (in CosMx pixels); the selected FOV metadata has a
# median area of 9260 px^2, i.e. an equivalent radius of ~54.3 px, so start at 60 px.
scale = 60.0
scale_std = "25%"         
estimate_scale_from_centers = false
cluster_method = "louvain"      # the high-gene-count WTx panel suits louvain better than legacy MRF
n_clusters = 10
cluster_resolution = 1.0
cluster_graph_k = 15
cluster_n_dims = 20
cluster_basis_sample_size = 100000
prior_segmentation_confidence = 0.0
iters = 500
n_cells_init = 20000             # metadata has ~10,359 cells; avoid an over-large automatic value
nuclei_genes = ""
cyto_genes = ""

[prior]
type = "none"
unassigned_label = "0"
estimate_scale_from_prior = false

[plotting]
gene_composition_neigborhood = 100  # avoid the default n_genes/10 being too large for a high gene count
min_pixels_per_cell = 15
max_plot_size = 3000
ncv_method = "ri"
