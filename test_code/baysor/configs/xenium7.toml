# Baysor benchmark configuration for xenium7 (Human Prostate FFPE, Xenium
# Human 5K Pan Tissue & Pathways panel).
#
# The run script uses the pre-filtered, centre 10,000 x 10,000 native-pixel ROI
# table generated from outs/transcripts.parquet.  It contains qv >= 20 coding
# transcripts and has columns x_um, y_um and gene.  platform_cell is retained
# only as provenance and is deliberately not supplied as a Baysor prior.
# Coordinates are in micrometres; force_2d is appropriate for Xenium's z stack.

[molecules]
x = "x_um"
y = "y_um"
z = "z"
gene = "gene"
force_2d = true
min_molecules_per_gene = 1
min_molecules_per_cell = 50
confidence_nn_id = 26
exclude_genes = "NegControl*,UnassignedCodeword*,DeprecatedCodeword*,GenomicControl*,BLANK*,Blank*,antisense_*"
# Centre ROI in the global micrometre coordinate system.  These bounds also
# document the filtering used to create the input cache.
x_min = 4692.0
x_max = 6817.0
y_min = 2169.625
y_max = 4294.625

[segmentation]
# Median equivalent radius of platform cells in the same benchmark ROI
# (sqrt(cell_area/pi) = 4.1635 um); this is a scale calibration, not a prior.
scale = 4.1635
scale_std = "25%"
estimate_scale_from_centers = false
cluster_method = "louvain"
n_clusters = 10
cluster_resolution = 1.0
cluster_graph_k = 15
cluster_n_dims = 20
cluster_basis_sample_size = 100000
prior_segmentation_confidence = 0.0
iters = 500
tol = 0.0
n_cells_init = 0
nuclei_genes = ""
cyto_genes = ""

[prior]
type = "none"
unassigned_label = "UNASSIGNED"
estimate_scale_from_prior = false

[plotting]
gene_composition_neighborhood = 100
min_pixels_per_cell = 10
max_plot_size = 3000
ncv_method = "ri"
