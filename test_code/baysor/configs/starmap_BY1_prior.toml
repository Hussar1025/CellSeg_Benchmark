# Baysor preset for spots_all.csv with its transcript-native clustermap prior.
# Run with spots_all.csv :clustermap, or omit the positional prior because
# [prior] below already names the column.

[molecules]
x = "spot_location_1"
y = "spot_location_2"
z = "spot_location_3"
gene = "gene_name"
force_2d = false
min_molecules_per_gene = 50
min_molecules_per_cell = 70
min_molecules_per_segment = 17
confidence_nn_id = 36
exclude_genes = ""

[segmentation]
# -1 lets Baysor estimate scale from the prior-cell centre distances.
scale = -1.0
scale_std = "25%"
cluster_method = "mrf"
n_clusters = 4
prior_segmentation_confidence = 0.2
iters = 500
tol = 0.0
n_cells_init = 0
nuclei_genes = ""
cyto_genes = ""

[prior]
type = "column"
column_name = "clustermap"
# Arrow stringifies this numeric CSV column as "-1" (not "-1.0").
unassigned_label = "-1"
estimate_scale_from_prior = true

[plotting]
gene_composition_neigborhood = 200
min_pixels_per_cell = 15
max_plot_size = 3000
ncv_method = "ri"
