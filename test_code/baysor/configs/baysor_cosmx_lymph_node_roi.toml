# Baysor C++ config: CosMx lymph node center ROI (~11,000 reference cells)
# Input is a gzip-compressed CSV; the current C++ Baysor only accepts CSV/Parquet,
# so decompress it or generate an ROI CSV first.
# The ROI uses global x_global_px/y_global_px coordinates and covers a 2 x 2 FOV around the center.

[data]
x = "x_global_px"
y = "y_global_px"
z = "z"
gene = "target"
force_2d = true                 # z is a discrete focal-plane index, not on the same unit scale as x/y
min_molecules_per_gene = 1
exclude_genes = "SystemControl*,Negative*"
min_molecules_per_cell = 80
confidence_nn_id = 16

[segmentation]
# scale is the cell radius (in CosMx pixels); metadata median area 3288 px^2, equivalent radius ~32 px
scale = 35.0
scale_std = "25%"
estimate_scale_from_centers = false
cluster_method = "mrf"
n_clusters = 0
cluster_resolution = 1.0
cluster_graph_k = 15
cluster_n_dims = 20
cluster_basis_sample_size = 100000
prior_segmentation_confidence = 0.0
iters = 500
n_cells_init = 20000
nuclei_genes = ""
cyto_genes = ""

[prior]
unassigned_label = "0"
estimate_scale_from_prior = false

[plotting]
gene_composition_neigborhood = 0
min_pixels_per_cell = 15
max_plot_size = 3000
ncv_method = "ri"
