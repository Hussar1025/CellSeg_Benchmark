# Baysor C++ 配置：CosMx lymph node 中心 ROI（约 1.1 万个参考细胞）
# 输入是 gzip 压缩 CSV；当前 C++ Baysor 只接受 CSV/Parquet，需先解压或生成 ROI CSV。
# ROI 采用全局 x_global_px/y_global_px 坐标，覆盖中心附近 2 x 2 FOV。

[data]
x = "x_global_px"
y = "y_global_px"
z = "z"
gene = "target"
force_2d = true                 # z 为离散焦平面编号，不按与 x/y 相同单位参与距离
min_molecules_per_gene = 1
exclude_genes = "SystemControl*,Negative*"
min_molecules_per_cell = 80
confidence_nn_id = 16

[segmentation]
# scale 是细胞半径（单位：CosMx pixel）；metadata 中位面积 3288 px^2，等效半径约 32 px
scale = 35.0
scale_std = "25%"
estimate_scale_from_centers = false
cluster_method = "mrf"
n_clusters = 0
cluster_resolution = 1.0
cluster_graph_k = 15
cluster_n_dims = 20
cluster_basis_sample_size = 100000
prior_segmentation_confidence = 0.0
iters = 500
n_cells_init = 20000
nuclei_genes = ""
cyto_genes = ""

[prior]
unassigned_label = "0"
estimate_scale_from_prior = false

[plotting]
gene_composition_neigborhood = 0
min_pixels_per_cell = 15
max_plot_size = 3000
ncv_method = "ri"
